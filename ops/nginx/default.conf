limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;

server {
  listen 8080;
  server_name _;
  return 308 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  ssl_certificate /run/secrets/tls_cert;
  ssl_certificate_key /run/secrets/tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

  # The signed controller state is verified independently by the backend. The
  # co-located marker is the edge half of the accepted dual write gate.
  set $satco_write_gate 0;
  if (-f /run/satco-ops/write-blocked) { set $satco_write_gate 1; }
  if ($request_method ~ ^(POST|PUT|PATCH|DELETE)$) { set $satco_write_gate "${satco_write_gate}m"; }
  if ($satco_write_gate = 1m) { return 503; }

  location = /health/live { proxy_pass http://backend:8000; }
  location = /health/ready { proxy_pass http://backend:8000; }
  location /api/v1/ {
    limit_req zone=public_api burst=20 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/(auth|audit-logs|contacts|customers|engineering-copilot|engineering-experience-captures|engineering-knowledge-graph|engineering-objects|engineering-relationships|engineering-workspaces|evidence|organization-admin|organizational-memory|platform/bootstrap|projects|search|technical-reports|workspaces)(/|$) {
    limit_req zone=public_api burst=20 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { proxy_pass http://frontend:8080; }
}
