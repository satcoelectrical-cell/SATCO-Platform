[project]
name = "satco-platform-backend"
version = "0.1.0"
requires-python = ">=3.12, <3.15"
dependencies = [
    "alembic>=1.18.5",
    "boto3>=1.42.0,<2",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
test = [
    "httpx2==2.9.1",
    "pytest>=9.1.1",
]

[tool.uv]
default-groups = ["test"]
package = false
